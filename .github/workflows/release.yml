name: Build & Release

# Läuft NUR bei einem Versions-Tag (v1.2.3) oder manuell („Run workflow“).
# Neue Version veröffentlichen: scripts/release.sh 1.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "GitHub Release anlegen (Tag v<Version aus installer/HasiZip.iss>)"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # Anmeldung bei Azure zum Signieren (Windows)

jobs:
  windows:
    name: Windows Setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Tests
        run: dotnet test tests/HasiZip.Core.Tests --nologo

      # Ordner statt Single-File: startet aus dem Kontextmenü ohne Entpack-Verzögerung (ReadyToRun = kein JIT-Warmlauf)
      - name: Publish App
        run: dotnet publish src/HasiZip.App -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -p:DebugType=none -o publish/app

      - name: Publish CLI (hasizip.exe)
        run: dotnet publish src/HasiZip.Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish/cli

      - name: Selbsttest der veröffentlichten App
        shell: pwsh
        run: |
          $p = Start-Process publish/app/HasiZip.exe -ArgumentList "--selftest", "$env:RUNNER_TEMP\st" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen" }

      # Signatur mit Microsoft Artifact Signing ("Hasi-Elektronic"). Anmeldung per OIDC – keine Secrets nötig:
      # Die IDs sind nicht geheim, Azure lässt nur Workflows aus hasi-elektronic/* zu.
      - name: Azure-Anmeldung (Signatur)
        if: runner.os == 'Windows'
        uses: azure/login@v2
        with:
          client-id: 5a2bd4d9-004a-4280-a1fd-b46f846dc62a
          tenant-id: c3f2023b-fc42-4fdd-a45d-d70fe78cd294
          subscription-id: ae83a62f-4d85-46f0-b0ac-f823fef82750

      - name: Signatur vorbereiten
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $jar = Join-Path $env:RUNNER_TEMP 'jsign.jar'
          Invoke-WebRequest https://github.com/ebourg/jsign/releases/download/7.1/jsign-7.1.jar -OutFile $jar
          $token = az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv
          if (-not $token) { throw 'Kein Zugriffstoken für Artifact Signing' }
          Write-Host "::add-mask::$token"
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\sign-win.ps1'
          @(
            "JSIGN_JAR=$jar", "SIGN_TOKEN=$token", 'SIGN_HOST=neu.codesigning.azure.net',
            'SIGN_ACCOUNT=hasi-elektronic-signing', 'SIGN_PROFILE=hasi-pdf', 'SIGN_NAME=HasiZip',
            "SIGN_SCRIPT=$script"
          ) | Add-Content $env:GITHUB_ENV

      - name: Programme signieren
        shell: pwsh
        run: scripts/sign-win.ps1 publish/app/HasiZip.exe publish/cli/hasizip.exe

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if ($env:SIGN_TOKEN) { & $iscc /DSIGN "/Shasi=pwsh -NoProfile -File $env:SIGN_SCRIPT `$f" installer\HasiZip.iss }
          else { & $iscc installer\HasiZip.iss }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $v = (Select-String -Path installer\HasiZip.iss -Pattern '#define MyAppVersion "(.+)"').Matches[0].Groups[1].Value
          Compress-Archive -Path publish\cli\hasizip.exe -DestinationPath "dist\HasiZip-CLI-$v-win-x64.zip"
          Get-ChildItem dist

      - name: Signatur prüfen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem dist/*.exe, publish/app/HasiZip.exe, publish/cli/hasizip.exe) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($s.Status) – $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { Write-Host "::error title=Nicht signiert::$($f.Name)"; exit 1 }
          }

      - uses: actions/upload-artifact@v5
        with:
          name: HasiZip-Windows
          path: |
            dist/*.exe
            dist/*.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version bestimmen
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # Manueller Start: Tag aus der Installer-Version, Release legt ihn selbst an
            echo "tag=v$(sed -nE 's/#define MyAppVersion "(.+)"/\1/p' installer/HasiZip.iss)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HasiZip ${{ steps.v.outputs.tag }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
          generate_release_notes: false
          body: "HasiZip für Windows – Setup (mit Kontextmenü) und Kommandozeilen-Version."
